name: Verify Barrows Morytania Interactions
on:
  push:
    branches:
      - Feature/Barrows
    paths:
      - 'Server/src/main/java/com/rs2/model/gameplay/barrows/**'
      - 'Server/src/main/java/com/rs2/model/combat/CombatAction.java'
      - 'Server/src/main/java/com/rs2/model/combat/special/SpecialAttackDefinition.java'
      - 'Server/src/main/java/com/rs2/model/interaction/TableItemPlacement.java'
      - 'Server/src/main/java/com/rs2/model/interaction/ItemOnObjectTask.java'
      - 'Server/src/main/java/com/rs2/model/dialogue/OldCroneDialogue.java'
      - 'Server/src/main/java/com/rs2/model/dialogue/DialogueManager.java'
      - 'Server/src/main/java/com/rs2/model/ground/GroundItem.java'
      - 'Server/src/main/java/com/rs2/model/ground/GroundItemManager.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/ItemActionPacketHandler.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/ButtonClickPacketHandler.java'
      - 'Server/src/test/java/MorytaniaBarrowsInteractionChecks.java'
      - 'Server/src/test/java/Barrows443PuzzleInterfaceChecks.java'
      - 'Server/src/test/java/BarrowsHistoricalPuzzleChecks.java'
      - 'Server/src/test/java/BarrowsNpcSpawnAuditChecks.java'
      - 'Server/src/test/java/BarrowsTunnelEncounterChecks.java'
      - 'Server/src/test/java/BarrowsBrotherSpecialCombatChecks.java'
      - '.github/workflows/verify-barrows-morytania.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Audit native book widget text-line dimensions
        working-directory: Server
        run: |
          mkdir -p widget-audit-classes
          javac -cp 'lib/*' -d widget-audit-classes \
            src/main/java/com/rs2/cache/js5/ConfigReader.java \
            src/main/java/com/rs2/cache/js5/Js5CacheStore.java \
            src/main/java/com/rs2/cache/js5/Js5Container.java \
            src/main/java/com/rs2/cache/js5/Js5Group.java \
            src/main/java/com/rs2/cache/js5/Js5ReferenceTable.java \
            src/main/java/com/rs2/cache/js5/Interfaces.java \
            src/test/java/BarrowsBookWidgetAudit.java
          java -cp 'widget-audit-classes:lib/*' BarrowsBookWidgetAudit
      - name: Compile server and run Barrows interaction regressions
        working-directory: Server
        run: |
          mkdir -p barrows-test-classes
          find src/main/java -name '*.java' > /tmp/barrows-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d barrows-test-classes @/tmp/barrows-sources.txt
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/MorytaniaBarrowsInteractionChecks.java \
            src/test/java/Barrows443PuzzleInterfaceChecks.java \
            src/test/java/BarrowsHistoricalPuzzleChecks.java
          java -cp 'barrows-test-classes:lib/*' MorytaniaBarrowsInteractionChecks
          java -cp 'barrows-test-classes:lib/*' Barrows443PuzzleInterfaceChecks
          java -cp 'barrows-test-classes:lib/*' BarrowsHistoricalPuzzleChecks
      - name: Audit Barrows NPC spawns against native collision and combat definitions
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsNpcSpawnAuditChecks.java \
            src/test/java/BarrowsTunnelEncounterChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsNpcSpawnAuditChecks
          java -cp 'barrows-test-classes:lib/*' BarrowsTunnelEncounterChecks
      - name: Verify all six Barrows brothers' NPC special effects in combat
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsBrotherSpecialCombatChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsBrotherSpecialCombatChecks
