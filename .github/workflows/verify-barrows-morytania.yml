name: Verify Barrows Morytania Interactions
on:
  push:
    branches:
      - Feature/Barrows
    paths:
      - 'Server/src/main/java/com/rs2/model/gameplay/barrows/**'
      - 'Server/src/main/java/com/rs2/model/combat/CombatAction.java'
      - 'Server/src/main/java/com/rs2/model/combat/BarrowsSpecialEffect.java'
      - 'Server/src/main/java/com/rs2/model/combat/CombatManager.java'
      - 'Server/src/main/java/com/rs2/model/combat/special/SpecialAttackDefinition.java'
      - 'Server/src/main/java/com/rs2/model/item/BarrowsEquipmentDurability.java'
      - 'Server/src/main/java/com/rs2/model/item/DegradableEquipmentHandler.java'
      - 'Server/src/main/java/com/rs2/model/item/action/BarrowsRepairHandler.java'
      - 'Server/src/main/java/com/rs2/model/player/EquipmentManager.java'
      - 'Server/src/main/java/com/rs2/model/player/Player.java'
      - 'Server/src/main/java/com/rs2/model/player/BarrowsChestDamageTask.java'
      - 'Server/src/main/java/com/rs2/model/World.java'
      - 'Server/src/main/java/com/rs2/model/interaction/TableItemPlacement.java'
      - 'Server/src/main/java/com/rs2/model/interaction/ItemOnObjectTask.java'
      - 'Server/src/main/java/com/rs2/model/dialogue/OldCroneDialogue.java'
      - 'Server/src/main/java/com/rs2/model/dialogue/DialogueManager.java'
      - 'Server/src/main/java/com/rs2/model/ground/GroundItem.java'
      - 'Server/src/main/java/com/rs2/model/ground/GroundItemManager.java'
      - 'Server/src/main/java/com/rs2/net/packet/PacketSender.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/ItemActionPacketHandler.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/ButtonClickPacketHandler.java'
      - 'Server/src/test/java/MorytaniaBarrowsInteractionChecks.java'
      - 'Server/src/test/java/Barrows443PuzzleInterfaceChecks.java'
      - 'Server/src/test/java/BarrowsHistoricalPuzzleChecks.java'
      - 'Server/src/test/java/BarrowsPostLootEscapeChecks.java'
      - 'Server/src/test/java/com/rs2/net/packet/Barrows443CameraShakePacketChecks.java'
      - 'Server/src/test/java/BarrowsNpcSpawnAuditChecks.java'
      - 'Server/src/test/java/BarrowsTunnelEncounterChecks.java'
      - 'Server/src/test/java/BarrowsBrotherSpecialCombatChecks.java'
      - 'Server/src/test/java/BarrowsSpecialEffectAccuracyChecks.java'
      - 'Server/src/test/java/VeracsDefilerCombatChecks.java'
      - 'Server/src/test/java/BarrowsEquipmentDurabilityChecks.java'
      - 'Server/src/test/java/BarrowsRepairChecks.java'
      - 'Server/src/test/java/BarrowsItemLossChecks.java'
      - 'Server/src/test/java/BarrowsPrayerDrainChecks.java'
      - 'Server/src/test/java/com/rs2/model/gameplay/barrows/BarrowsChestRewardChecks.java'
      - '.github/workflows/verify-barrows-morytania.yml'
  pull_request:
    branches:
      - Feature/Barrows
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Audit native book widget text-line dimensions
        working-directory: Server
        run: |
          mkdir -p widget-audit-classes
          javac -cp 'lib/*' -d widget-audit-classes \
            src/main/java/com/rs2/cache/js5/ConfigReader.java \
            src/main/java/com/rs2/cache/js5/Js5CacheStore.java \
            src/main/java/com/rs2/cache/js5/Js5Container.java \
            src/main/java/com/rs2/cache/js5/Js5Group.java \
            src/main/java/com/rs2/cache/js5/Js5ReferenceTable.java \
            src/main/java/com/rs2/cache/js5/Interfaces.java \
            src/test/java/BarrowsBookWidgetAudit.java
          java -cp 'widget-audit-classes:lib/*' BarrowsBookWidgetAudit
      - name: Compile server and run Barrows interaction regressions
        working-directory: Server
        run: |
          mkdir -p barrows-test-classes
          find src/main/java -name '*.java' > /tmp/barrows-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d barrows-test-classes @/tmp/barrows-sources.txt
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/MorytaniaBarrowsInteractionChecks.java \
            src/test/java/Barrows443PuzzleInterfaceChecks.java \
            src/test/java/BarrowsHistoricalPuzzleChecks.java
          java -cp 'barrows-test-classes:lib/*' MorytaniaBarrowsInteractionChecks
          java -cp 'barrows-test-classes:lib/*' Barrows443PuzzleInterfaceChecks
          java -cp 'barrows-test-classes:lib/*' BarrowsHistoricalPuzzleChecks
      - name: Audit Barrows NPC spawns against native collision and combat definitions
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsNpcSpawnAuditChecks.java \
            src/test/java/BarrowsTunnelEncounterChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsNpcSpawnAuditChecks
          java -cp 'barrows-test-classes:lib/*' BarrowsTunnelEncounterChecks
      - name: Verify all six Barrows brothers' NPC special effects in combat
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsBrotherSpecialCombatChecks.java \
            src/test/java/VeracsDefilerCombatChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsBrotherSpecialCombatChecks
          java -cp 'barrows-test-classes:lib/*' VeracsDefilerCombatChecks
      - name: Verify 15-hour Barrows combat degradation and save persistence
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsEquipmentDurabilityChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsEquipmentDurabilityChecks
      - name: Verify historical Barrows repair NPCs and partial/full prices
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsRepairChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsRepairChecks
      - name: Verify pristine and worn Barrows gear break on death and prayer faces
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsItemLossChecks.java \
            src/test/java/BarrowsPrayerDrainChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsItemLossChecks
          java -cp 'barrows-test-classes:lib/*' BarrowsPrayerDrainChecks
      - name: Verify 2006 Barrows chest loot delivery and one-time rewards
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/com/rs2/model/gameplay/barrows/BarrowsChestRewardChecks.java
          java -cp 'barrows-test-classes:lib/*' com.rs2.model.gameplay.barrows.BarrowsChestRewardChecks
      - name: Verify 2006 Barrows effect odds, attack styles and drain magnitudes
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsSpecialEffectAccuracyChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsSpecialEffectAccuracyChecks
      - name: Verify 2006 Barrows post-loot escape and collapse cleanup
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/BarrowsPostLootEscapeChecks.java
          java -cp 'barrows-test-classes:lib/*' BarrowsPostLootEscapeChecks
      - name: Verify native revision-443 Barrows camera shake packet
        working-directory: Server
        run: |
          javac -encoding UTF-8 -cp 'barrows-test-classes:lib/*' -d barrows-test-classes \
            src/test/java/com/rs2/net/packet/Barrows443CameraShakePacketChecks.java
          java -cp 'barrows-test-classes:lib/*' com.rs2.net.packet.Barrows443CameraShakePacketChecks
