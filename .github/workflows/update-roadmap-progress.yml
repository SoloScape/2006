name: Update Roadmap Progress

on:
  push:
    branches:
      - main
    paths:
      - 'readme.md'
      - 'tools/update-roadmap-progress.py'
      - '.github/workflows/update-roadmap-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-roadmap-progress-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recalculate roadmap status percentage and SVG
        run: python3 tools/update-roadmap-progress.py

      - name: Commit changed progress files
        run: |
          set -euo pipefail
          if ! git diff --quiet -- readme.md docs/roadmap-progress.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- readme.md docs/roadmap-progress.svg
            git commit -m 'docs: sync roadmap completion percentage and bar'
            git push origin HEAD:main
          else
            echo 'Progress already matches the roadmap.'
          fi
